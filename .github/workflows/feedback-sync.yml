name: Sync reader feedback
on:
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: reader-feedback-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Synchronize saved feedback to Issues
        run: node scripts/sync-feedback.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          FEEDBACK_SYNC_TOKEN: ${{ secrets.FEEDBACK_SYNC_TOKEN }}
